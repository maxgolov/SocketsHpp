name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            compiler: gcc-sanitizers
            cc: gcc
            cxx: g++
            cmake_extra: -DENABLE_ASAN=ON -DENABLE_UBSAN=ON
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
          - os: macos-latest
            compiler: clang
            cc: clang
            cxx: clang++
          - os: windows-latest
            compiler: msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build libgtest-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ninja googletest

      # Windows resolves its dependencies (gtest, nlohmann-json, ...) through the
      # vcpkg manifest (vcpkg.json). The CMake toolchain below auto-installs them
      # in manifest mode during Configure, so no explicit `vcpkg install` step is
      # needed (and explicit package arguments are rejected in manifest mode).

      - name: Configure Linux
        if: runner.os == 'Linux'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DSOCKETSHPP_BUILD_TESTS=ON
          -DSOCKETSHPP_WARNINGS_AS_ERRORS=ON
          -DBUILD_EXAMPLES=ON
          ${{ matrix.cmake_extra }}

      - name: Configure macOS
        if: runner.os == 'macOS'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DSOCKETSHPP_BUILD_TESTS=ON
          -DCMAKE_PREFIX_PATH="$(brew --prefix googletest)"
          -DBUILD_EXAMPLES=ON

      - name: Configure Windows
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build -A x64
          -DSOCKETSHPP_BUILD_TESTS=ON
          -DBUILD_EXAMPLES=ON
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Test
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --build-config Debug --output-on-failure --timeout 120
